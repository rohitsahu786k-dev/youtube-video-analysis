services:
  web:
    build: .
    env_file: .env
    environment:
      HOST: 0.0.0.0
      APP_ENV: production
    volumes:
      - ./storage:/app/storage
    restart: unless-stopped
    expose:
      - "8000"
  caddy:
    image: caddy:2
    depends_on: [web]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    restart: unless-stopped
volumes:
  caddy_data:
