name: Bootstrap source
on:
  push:
    paths:
      - '.bootstrap/fx-full.tar.gz.b64'
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore full source tree
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .bootstrap/fx-full.tar.gz.b64 > /tmp/fx-full.tar.gz
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .bootstrap -exec rm -rf {} +
          tar -xzf /tmp/fx-full.tar.gz -C .
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap-source.yml
      - name: Commit restored application
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat: complete forex trader video intelligence platform"
          git push origin HEAD:main
