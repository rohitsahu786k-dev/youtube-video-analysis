name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      MOCK_AI_MODE: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python -m compileall -q pyapp
      - run: python -m pytest -q
      - run: python tools/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: trader-video-intelligence
          path: dist/trader-video-intelligence.zip
